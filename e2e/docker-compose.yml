# Local MySQL for API and end-to-end tests.
#   docker compose -f e2e/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: hsc-exam-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hsc_exam_local
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      retries: 20
